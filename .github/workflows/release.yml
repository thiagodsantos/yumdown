name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate version tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version tag such as v1.2.3; received $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.23.0
      - name: Install Wails Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build Linux amd64 app
        run: wails build
      - name: Package app
        run: |
          test -f build/bin/yumdown
          mkdir -p dist
          cp build/bin/yumdown dist/yumdown
          version="${GITHUB_REF_NAME#v}"
          tar -C dist -czf "dist/yumdown_${version}_linux_amd64.tar.gz" yumdown
      - uses: actions/upload-artifact@v4
        with:
          name: yumdown-${{ github.ref_name }}-linux-amd64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: yumdown-${{ github.ref_name }}-linux-amd64
          path: dist
      - name: Prepare release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            $0 == heading || index($0, heading " - ") == 1 {
              found = 1
              print
              next
            }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/yumdown_${version}_linux_amd64.tar.gz" \
            --title "Yumdown $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag

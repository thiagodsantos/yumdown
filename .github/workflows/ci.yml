name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.23.0
      - name: Install Wails Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend format check
        working-directory: frontend
        run: pnpm format:check
      - name: Frontend lint
        working-directory: frontend
        run: pnpm lint
      - name: Frontend typecheck
        working-directory: frontend
        run: pnpm typecheck
      - name: Frontend tests
        working-directory: frontend
        run: pnpm test
      - name: Go tests
        run: go test ./...
      - name: Cross-compile Windows amd64 Go targets
        run: go test -exec=true ./...
        env:
          GOOS: windows
          GOARCH: amd64
      - name: Cross-compile macOS arm64 Go targets
        run: go test -exec=true ./...
        env:
          GOOS: darwin
          GOARCH: arm64
      - name: Wails Linux build
        run: wails build

name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.23.0
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend format check
        working-directory: frontend
        run: pnpm format:check
      - name: Frontend lint
        working-directory: frontend
        run: pnpm lint
      - name: Frontend typecheck
        working-directory: frontend
        run: pnpm typecheck
      - name: Frontend tests
        working-directory: frontend
        run: pnpm test
      - name: Build frontend assets
        working-directory: frontend
        run: pnpm build
      - name: Go tests
        run: go test ./...
      - name: Cross-compile Windows amd64 Go targets
        run: go test -exec=true ./...
        env:
          GOOS: windows
          GOARCH: amd64
      - name: Cross-compile macOS arm64 Go targets
        run: go test -exec=true ./...
        env:
          GOOS: darwin
          GOARCH: arm64
